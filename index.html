<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Открыть файл</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #c940b9 0%, #f400ab 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: rgb(246, 146, 255);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .download-btn {
            background: linear-gradient(165deg, #f7f5f9 0%, #39393c 150%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            margin: 10px;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        .error {
            color: #e74c3c;
            margin-top: 15px;
            font-size: 14px;
            display: none;
        }

        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💎</h1>
        
        <div class="buttons-container">
            <button class="download-btn" onclick="openFile('file1')">
                📄 Открыть файл 1
            </button>
            
            <button class="download-btn" onclick="openFile('file2')">
                📦 Открыть файл 2
            </button>
        </div>
        
        <div class="error" id="errorMsg">
            Ошибка при открытии файла
        </div>
    </div>

    <script>
        // УКАЖИТЕ АДРЕСА ВАШИХ ФАЙЛОВ ЗДЕСЬ
        const FILES = {
            file1: {
                url: 'https://example.com/file1.pdf'
            },
            file2: {
                url: 'https://example.com/file2.zip'
            }
        };
        
        function openFile(fileKey) {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';
            
            const file = FILES[fileKey];
            
            if (!file) {
                errorMsg.textContent = 'Файл не найден в конфигурации!';
                errorMsg.style.display = 'block';
                return;
            }
            
            // Открываем файл в новой вкладке браузера
            window.open(file.url, '_blank');
        }
    </script>
</body>
</html>
